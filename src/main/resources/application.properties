# Application
spring.application.name=compliance-automation
server.port=8080

# Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Compliance processing SLA (milliseconds)
compliance.processing.timeout-ms=5000
compliance.batch.max-concurrency=10

# Load local secrets from .env in the working directory (optional; does not fail if missing)
spring.config.import=optional:file:.env[.properties]

# OpenAI / Spring AI — set OPENAI_API_KEY in .env or as an environment variable
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.0

# Disable OpenAI auto-configured models; ChatModel is wired manually in AiConfig
spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.threasury.compliance=INFO
