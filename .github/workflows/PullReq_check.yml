name: Enforce Ticket ID on Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-details:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR Title and Description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATTERN="CM-[0-9]+"

          # Combine title and body into a single safe variable check
          COMBINED_TEXT="${PR_TITLE} ${PR_BODY}"

          echo "Checking PR Title: ${PR_TITLE}"

          # -i makes pattern case-insensitive (matches CM-123, cm-123)
          # -q keeps output quiet
          # -E enables extended regex
          if echo "$COMBINED_TEXT" | grep -iqE "$PATTERN"; then
            echo " Valid ticket pattern found in PR details."
          else
            echo " Missing ticket pattern 'CM-xxxxx' in PR title or body."

            # Post comment to the PR
            gh pr comment $PR_NUMBER --body " **PR Validation Failed:** Your PR title or body must include a valid ticket ID matching \`CM-xxxxx\` (e.g., \`CM-12345\`). Please update the PR title or description to unblock merging."

            exit 1 
          fi
