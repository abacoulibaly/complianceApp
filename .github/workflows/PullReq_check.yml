name: Enforce Ticket ID on Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-details:
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR Title and Description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATTERN="[cC][mM]-[0-9]+"

          # Check if either title OR description contains CM-xxxxx
          if echo "$PR_TITLE $PR_BODY" | grep -qE "$PATTERN"; then
            echo " Valid ticket pattern found in PR details."
          else
            echo " Missing ticket pattern 'CM-xxxxx' in PR title or body."

            # Post a comment to the PR alerting the author
            gh pr comment $PR_NUMBER --body " **PR Validation Failed:** Your PR title or body must include a valid ticket ID matching \`CM-xxxxx\` (e.g., \`CM-12345\`). Please update the PR title/description to unblock merging."

            exit 1
          fi
